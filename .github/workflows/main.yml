name: Django Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Ansible
        run: ansible --version

      - name: Test EC2 connectivity
        run: |
          ansible \
            -i inventory.ini \
            -m ping

      - name: Deploy Django
        run: |
          ansible-playbook \
            -i inventory.ini \
            playbook.yml
