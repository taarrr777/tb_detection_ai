version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_db_container
    restart: always
    environment:
      -  MYSQL_DATABASE=web_xray_db
      -  MYSQL_ALLOW_EMPTY_PASSWORD="yes"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: 
      context: ./core
      dockerfile: Dockerfile
    container_name: django_web_container
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=web_xray_db
      - DB_USER=root
      - DB_PASS=
    volumes:
      - ./core:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data: